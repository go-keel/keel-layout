        api.keel_layout.v1.Todo:
            type: object
            properties:
                id:
                    type: string
                    description: Unique id assigned by the server; read-only on create.
                title:
                    type: string
                    description: Title.
                content:
                    type: string
                    description: Detailed content.
                completed:
                    type: boolean
                    description: Whether it is completed.
                createTime:
                    type: string
                    description: Creation time, assigned by the server, read-only.
                    format: date-time
                updateTime:
                    type: string
                    description: Last modification time, assigned by the server, read-only.
                    format: date-time
            description: The canonical representation of the Todo resource.
        api.keel_layout.v1.TodoListItem:
            type: object
            properties:
                id:
                    type: string
                    description: Unique id.
                title:
                    type: string
                    description: Title.
                completed:
                    type: boolean
                    description: Whether it is completed.
                createTime:
                    type: string
                    description: Creation time.
                    format: date-time
                updateTime:
                    type: string
                    description: Last modification time.
                    format: date-time
            description: |-
                TodoListItem is one row of the list: only the fields the list shows, not a reuse of the detail Todo.
                 Sharing it would turn fields added to the detail into empty fields in the list, read as "really empty".
tags:
    - name: TodoService
