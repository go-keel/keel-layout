# Shared file: carried verbatim; never localized outside its source repository.
# Checked by scripts/check-cross-repo-sync.sh; see docs/upgrading-protocol.md.
#
# Defines how the real client IP is computed; by itself it changes no site's requests. Put it in conf.d/ (these
# definitions are only allowed at the http level). To enable it for a site, include snippets/client-ip-headers.conf
# in that site's server block. Explanation: docs/guides/deploy-nginx.md.
# On the server this copy contains secrets: owned by root, mode 600. On upgrade keep the configuration area and
# replace everything else wholesale.
#
# How the client IP is chosen (top to bottom; the first "yes" wins and the rest are not checked):
#
#   request arrives
#     │
#     ├─ 1. Does its secret match block 1? (when split by domain, the secret must also belong to this domain)
#     │     ├─ yes → take CF-Connecting-IP (written by Cloudflare); log route=cf, or cf+aws if it came in on a
#     │     │        block 3 port
#     │     └─ no ↓
#     │
#     ├─ 2. Did it come in on a port listed in block 3?
#     │     ├─ yes → take the address in CloudFront-Viewer-Address (written by CloudFront); log route=aws
#     │     └─ no ↓
#     │
#     └─ 3. Take the address of the peer actually connected to nginx (the client itself when it connects
#           directly); log route=direct
#
# Trust rests on the secret and the port, not the peer's address: both providers' address ranges are shared by all
# their customers and prove nothing about being ours.
# A malformed header (empty, or joined into several values) also falls through; at worst the address becomes a CDN
# node's, which cannot be forged.
# A request through Cloudflare and then CloudFront satisfies both 1 and 2; 1 wins, since CloudFront only saw the
# Cloudflare node's address.

# ======== Configuration area: change only this part when deploying ========
#
# No Cloudflare / CloudFront in front of the program: leave all three blocks alone and drop the file in as is.
# Fill in the block of each provider you use and leave the others as they are. Lines starting with # in each block
# are examples and have no effect; write a line following the example (no leading #, trailing semicolon), then run
# nginx -t && nginx -s reload.

# [1. Cloudflare origin secret] Fill in if you use Cloudflare (whether or not CloudFront follows it).
# The secret is a random string that Cloudflare sends in the X-Origin-Secret-CF request header when it connects to
# the origin; only when it matches does nginx trust the client IP Cloudflare reports.
# Generate one: openssl rand -hex 16 (32 lowercase hex characters).
# Each line: <secret>  ":<label>";    replace the angle brackets and their content with the real value.
#   label: a name for this secret, shown as cf_key in the access log to tell old and new secrets apart, such as
#          k1, k2; never the secret itself. Leaving the part before the colon empty means every domain accepts it.
# To rotate, first add a line for the new secret (old and new both valid); once Cloudflare is switched and the old
# label no longer shows in the log, delete the old line.
map $http_x_origin_secret_cf $edge_cf_secret {
    default "";

    # Example 1: one secret shared by all domains (most common)
    # <32-character secret>  ":k1";

    # Example 2: during rotation old and new are both valid; delete the k1 line once Cloudflare is switched
    # <old 32-character secret>  ":k1";
    # <new 32-character secret>  ":k2";

    # Example 3: split by domain with block 2; brand-a's domains accept only this one, other domains the shared k1
    # <brand-a 32-character secret>  "brand-a:k1";
    # <shared 32-character secret>   ":k1";
}

# [2. Different secrets per domain] Fill in only when one nginx serves several Cloudflare sites that should not
# share a secret; otherwise leave it empty.
# Each line: domain  site;    (choose the site name yourself; letters, digits, - and _ only)
#   api.a.com matches only that domain; .a.com matches a.com and all its subdomains.
# A domain listed here accepts only the block 1 lines written as secret "site:label";, no longer the shared
# ":label" secrets; so when you add a domain here, add its secret to block 1 at the same time, or no request to
# that domain through Cloudflare is recognized.
map $host $edge_cf_site {
    hostnames;
    default "";

    # Example 1: a single domain
    # api.a.com  brand-a;

    # Example 2: a.com itself and all its subdomains (leading dot)
    # .a.com     brand-a;

    # Example 3: two sites, each with its own secret (block 1 needs lines "brand-a:..." and "brand-b:...")
    # api.a.com  brand-a;
    # api.b.com  brand-b;
}

# [3. Dedicated CloudFront port] Fill in if you use CloudFront (VPC origin); otherwise leave it as is.
# Open a separate port for CloudFront (such as 8088; not 80 or 443). Each line: "port" cloudfront;
#   nginx treats every request arriving on a listed port as forwarded by CloudFront and trusts its client IP.
#   So only CloudFront may reach this port: the security group allows only CloudFront-VPCOrigins-Service-SG, and
#   nothing else may use it (Cloudflare, direct clients, load balancers, health checks), or the client IP can be
#   forged.
#   default "" means unlisted ports are not CloudFront; do not change that line.
map $server_port $edge_cloudfront_entry {
    default "";

    # Example 1: CloudFront on port 8088
    # "8088" cloudfront;

    # Example 2: two CloudFront distributions, one port each
    # "8088" cloudfront;
    # "8089" cloudfront;
}

# ======== Do not change anything below ========

# Implements the three steps of "How the client IP is chosen" at the top. Step 3 uses $realip_remote_addr, which
# needs nginx built with the realip module.

# The secret's site must equal the request domain's site (both empty means global); on a match cf_key is
# "site:label".
map "$edge_cf_site|$edge_cf_secret" $edge_cf_key {
    default "";
    "~^(?<edge_cf_s>[^|]*)\|\k<edge_cf_s>:.+$" $edge_cf_secret;
}

map $edge_cf_key $edge_cf_ok {
    ""      0;
    default 1;
}

map "$edge_cf_ok|$http_cf_connecting_ip" $edge_cf_ip {
    default "";
    "~^1\|(?<edge_cf_v4>[0-9]{1,3}(\.[0-9]{1,3}){3})$" $edge_cf_v4;
    "~^1\|(?<edge_cf_v6>[0-9A-Fa-f]*:[0-9A-Fa-f:.]{1,44})$" $edge_cf_v6;
}

# Format "IP:port"; IPv6 without brackets.
map "$edge_cloudfront_entry|$http_cloudfront_viewer_address" $edge_aws_ip {
    default "";
    "~^cloudfront\|(?<edge_aws_v4>[0-9]{1,3}(\.[0-9]{1,3}){3}):[0-9]{1,5}$" $edge_aws_v4;
    "~^cloudfront\|(?<edge_aws_v6>[0-9A-Fa-f]*:[0-9A-Fa-f:.]{1,44}):[0-9]{1,5}$" $edge_aws_v6;
}

map "$edge_cf_ip|$edge_aws_ip" $edge_client_ip {
    default $realip_remote_addr;
    "~^(?<edge_pick_cf>[^|]+)\|" $edge_pick_cf;
    "~^\|(?<edge_pick_aws>[^|]+)$" $edge_pick_aws;
}

# Route, used only for logging.
map "$edge_cf_ip|$edge_aws_ip|$edge_cloudfront_entry" $edge_route {
    default direct;
    "~^[^|]+\|[^|]*\|cloudfront$" cf+aws;
    "~^[^|]+\|" cf;
    "~^\|[^|]+\|" aws;
}

# Access log: a site enables it with access_log <path> client_ip;. Secrets are never logged.
log_format client_ip escape=json
    '{"time":"$time_iso8601","status":$status,"host":"$host","port":"$server_port","request":"$request",'
    '"route":"$edge_route","cf_key":"$edge_cf_key","client_ip":"$edge_client_ip","peer":"$realip_remote_addr",'
    '"raw_xff":"$http_x_forwarded_for","raw_cf_connecting_ip":"$http_cf_connecting_ip",'
    '"raw_cloudfront_viewer_address":"$http_cloudfront_viewer_address","cf_ray":"$http_cf_ray"}';
