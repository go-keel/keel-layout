# Shared file: carried verbatim; never localized outside its source repository.
# Checked by scripts/check-cross-repo-sync.sh; see docs/upgrading-protocol.md.
#
# Put this in /etc/nginx/snippets/, not conf.d/. It takes effect only where a site includes it: it overwrites the
# two address headers with the computed client IP, forwards the original values under new names for logging, and
# clears the secret; other headers pass through unchanged. Requires conf.d/client-ip.conf to be loaded.
# Usage: add one line to the program's server block
#     include /etc/nginx/snippets/client-ip-headers.conf;
# A location that sets its own proxy_set_header or grpc_set_header no longer inherits this set from the server,
# so include it again in that location. Wherever it is missed, client-supplied forwarding headers reach the
# program unchanged.

proxy_set_header X-Forwarded-For     $edge_client_ip;
proxy_set_header X-Real-IP           $edge_client_ip;
proxy_set_header X-Raw-Forwarded-For $http_x_forwarded_for;
proxy_set_header X-Raw-Real-IP       $http_x_real_ip;
proxy_set_header X-Origin-Secret-CF  "";

grpc_set_header  X-Forwarded-For     $edge_client_ip;
grpc_set_header  X-Real-IP           $edge_client_ip;
grpc_set_header  X-Raw-Forwarded-For $http_x_forwarded_for;
grpc_set_header  X-Raw-Real-IP       $http_x_real_ip;
grpc_set_header  X-Origin-Secret-CF  "";
