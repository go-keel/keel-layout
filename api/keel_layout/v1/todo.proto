// Example file: delete the whole file after forking

syntax = "proto3";

package api.keel_layout.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";
import "keel/v1/annotations.proto";

option go_package = "github.com/go-keel/keel-layout/api/keel_layout/v1;v1";

// TodoService is the template's example resource: one Todo resource runs through all five servers:
// HTTP API (cmd/api), gRPC (cmd/svc), MQ consumer / task worker /
// cron scheduler (cmd/worker). Replace it with your own domain resource.
service TodoService {
  // CreateTodo creates a Todo, stores it and broadcasts the todo_created event (the worker consumes it and enqueues a reminder task).
  rpc CreateTodo(CreateTodoRequest) returns (Todo) {
    option (google.api.http) = {
      post: "/v1/todos"
      body: "*"
    };
  }

  // ListTodo is a paged list: server-side paging (offset/limit) plus total, with sorting and filtering done on the
  // server too. Each filter has its own field, the sort is an enum, and the rows are a separate TodoListItem.
  //
  // Filtering **cannot** stay with the caller: with paging the caller only has the current page, and filtering it
  // yields "the matches on this page", not "the first page of matches"; requests still go out and the page still
  // renders, it just misses rows.
  rpc ListTodo(ListTodoRequest) returns (ListTodoReply) {
    option (google.api.http) = {
      get: "/v1/todos"
    };
    option (keel.v1.auth) = {allow_anonymous: true};
  }

  // UpdateTodo partially updates by FieldMask, overwriting only the fields listed in update_mask.
  rpc UpdateTodo(UpdateTodoRequest) returns (Todo) {
    option (google.api.http) = {
      patch: "/v1/todos/{todo.id}"
      body: "todo"
    };
  }

  // DeleteTodo deletes by id. Returns TODO_NOT_FOUND if it does not exist.
  rpc DeleteTodo(DeleteTodoRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/todos/{id}"
    };
  }

  // WatchTodo is a contract streaming example (Kratos v3: a server-stream RPC maps to both
  // gRPC streaming and HTTP SSE). The middleware chain runs once when the stream opens and wraps the whole stream,
  // not once per message; on the gRPC side there is no request message when the stream opens, so the limit
  // validate takes effect only over HTTP, and the implementation validates the request itself.
  // Over HTTP it pushes the current snapshot as text/event-stream and ends;
  // in real use, subscribe to an event source and keep pushing.
  rpc WatchTodo(WatchTodoRequest) returns (stream Todo) {
    option (google.api.http) = {
      get: "/v1/todos/watch"
    };
    option (keel.v1.auth) = {allow_anonymous: true};
  }

  // StreamTodoLookup is a contract bidi stream example (Kratos v3: a bidi-stream RPC maps to both
  // gRPC streaming and HTTP WebSocket). The middleware chain runs once when the stream opens and wraps the whole
  // stream, not once per message; a bidi stream has no request message when it opens, so validate takes effect on
  // neither side, and per-message validation belongs in the implementation.
  // The client streams ids, the server streams back the matching Todos; it ends when the client closes its send side.
  rpc StreamTodoLookup(stream GetTodoRequest) returns (stream Todo) {
    option (google.api.http) = {
      get: "/v1/todos/lookup"
    };
    option (keel.v1.auth) = {allow_anonymous: true};
  }

  // ExportTodo is a contract binary response example (1d): a unary call returns google.api.HttpBody,
  // raw bytes plus content_type as is, running through the middleware chain as usual. Suited to small files and
  // exports; large files needing Range or resumable download use the raw download path (see /examples/download).
  rpc ExportTodo(ExportTodoRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      get: "/v1/todos/export"
    };
    option (keel.v1.auth) = {allow_anonymous: true};
  }

  // GetTodo looks up a Todo by id. Returns TODO_NOT_FOUND if it does not exist. It comes after the fixed paths
  // (watch, lookup, export): HTTP routes are matched in declaration order, and /v1/todos/{id} would take them.
  rpc GetTodo(GetTodoRequest) returns (Todo) {
    option (google.api.http) = {
      get: "/v1/todos/{id}"
    };
    option (keel.v1.auth) = {allow_anonymous: true};
  }
}

// The canonical representation of the Todo resource.
message Todo {
  // Unique id assigned by the server; read-only on create.
  int64 id = 1;
  // Title.
  string title = 2;
  // Detailed content.
  string content = 3;
  // Whether it is completed.
  bool completed = 4;
  // Creation time, assigned by the server, read-only.
  google.protobuf.Timestamp create_time = 5;
  // Last modification time, assigned by the server, read-only.
  google.protobuf.Timestamp update_time = 6;
}

message CreateTodoRequest {
  string title = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string content = 2 [(buf.validate.field).string.max_len = 2000];
}

message GetTodoRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message ListTodoRequest {
  // Starting offset, from 0.
  int32 offset = 1 [(buf.validate.field).int32.gte = 0];
  // Page size; 0 uses the server default (20). Only the lte here bounds it; the code does not clamp again.
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // Completion status: 0 all, 1 yes, 2 no. Not 1/0: 0 already means "all".
  int32 completed = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 2
  }];
  // Sort; unset uses the server default.
  Sort sort = 4 [(buf.validate.field).enum.defined_only = true];

  // Sort is the optional sort of the list; the server accepts only the values listed here.
  enum Sort {
    // Server default: by creation order (id ascending).
    SORT_UNSPECIFIED = 0;
    // Most recently updated first.
    SORT_UPDATE_TIME_DESC = 1;
  }
}

message ListTodoReply {
  repeated TodoListItem todos = 1;
  // Total match count, unaffected by offset/limit. The caller's pager computes the page count from it; without it
  // the list shows as a single page.
  int64 total = 2;
}

// TodoListItem is one row of the list: only the fields the list shows, not a reuse of the detail Todo.
// Sharing it would turn fields added to the detail into empty fields in the list, read as "really empty".
message TodoListItem {
  // Unique id.
  int64 id = 1;
  // Title.
  string title = 2;
  // Whether it is completed.
  bool completed = 3;
  // Creation time.
  google.protobuf.Timestamp create_time = 4;
  // Last modification time.
  google.protobuf.Timestamp update_time = 5;
}

message UpdateTodoRequest {
  // Carries the new field values; todo.id identifies the target record and is required.
  Todo todo = 1 [(buf.validate.field).required = true];
  // The set of field paths to overwrite; fields not listed stay unchanged.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}

message DeleteTodoRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message ExportTodoRequest {
  // Maximum number of rows to export; 0 uses the server default (100).
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
}

message WatchTodoRequest {
  // Maximum number of snapshot rows; 0 uses the server default (20), at most 100. Same name and meaning as in
  // ListTodo: "how many to take at once" should have only one name in a repo.
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}
