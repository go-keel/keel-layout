version: v2
plugins:
  # All pinned with go run ...@version: no global install, no version drift
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11"]
    out: .
    opt:
      - paths=source_relative
      # The go_package of the imported errors/errors.proto still points at Kratos v2;
      # force-map it to v3 so generated code does not blank-import Kratos v2.
      - Merrors/errors.proto=github.com/go-kratos/kratos/v3/errors
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: .
    opt:
      - paths=source_relative
  - local: ["go", "run", "github.com/go-kratos/kratos/cmd/protoc-gen-go-http/v3@v3.0.0-20260526000039-30da04b769dc"]
    out: .
    opt:
      - paths=source_relative
  - local: ["go", "run", "github.com/go-kratos/kratos/cmd/protoc-gen-go-errors/v3@v3.0.0-20260526000039-30da04b769dc"]
    out: .
    opt:
      - paths=source_relative
      - Merrors/errors.proto=github.com/go-kratos/kratos/v3/errors
  - local: ["go", "run", "github.com/google/gnostic/cmd/protoc-gen-openapi@v0.7.1"]
    out: ..
    strategy: all
    opt:
      - fq_schema_naming=true
      - default_response=false
